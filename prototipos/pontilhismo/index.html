<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pontilhismo Base 8</title>
<style>
  :root {
    --branco: #ffffff; --noite: #1b1f3b; --rosa: #ff48b0;
    --verde: #12a180; --limao: #f5ee4a; --azul: #0b8fe0;
    --bg: var(--branco); --fg: var(--noite); --line: #d5d7e0;
  }
  body.escuro { --bg: var(--noite); --fg: var(--branco); --line: #3a3f63; }
  body.preto { --bg: #000; --fg: var(--branco); --line: #333; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, sans-serif; transition: background .4s, color .4s; }
  .stage { position: relative; height: calc(100vh - 96px); overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  .controls { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 13px; width: max-content; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(27,31,59,.12); }
  .group { display: flex; gap: 4px; align-items: center; }
  .group span { opacity: .6; margin-right: 4px; }
  .group[hidden] { display: none; }
  button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  @media (max-width: 800px) {
    .stage { height: 62vh; }
    .controls { position: static; transform: none; margin: 8px 16px 24px; width: auto; max-width: none; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="stage"><canvas id="c" aria-label="Peixe betta desenhado com pontos" role="img"></canvas></div>

<div class="controls">
  <div class="group" data-key="subject"><span>Tema</span>
    <button data-v="betta">Betta</button><button data-v="flor">Lírio</button><button data-v="gerbera">Gérbera</button><button data-v="dalia">Dália</button><button data-v="florescer">Florescer</button><button data-v="peixe">Betta nadando</button><button data-v="gatinho">Gatinho</button><button data-v="gatinho2">Gatinho 2</button><button data-v="olho">Olho</button></div>
  <div class="group" data-key="style"><span>Estilo</span>
    <button data-v="chars">Caracteres</button><button data-v="dots">Pontos</button><button data-v="dither">Dither</button></div>
  <div class="group" data-key="colors"><span>Cores</span>
    <button data-v="riso">Paleta riso</button><button data-v="original">Originais</button></div>
  <div class="group" data-key="bg"><span>Fundo</span>
    <button data-v="branco">Branco</button><button data-v="noite">Azul-noite</button><button data-v="preto">Preto</button></div>
  <div class="group" data-key="reveal"><span>Entrada</span>
    <button data-v="stroke">Pincelada</button><button data-v="grow">Crescer</button><button data-v="gather">Reunir</button></div>
  <div class="group" data-key="motion"><span>Movimento</span>
    <button data-v="video">Vídeo</button><button data-v="wave">Ondular</button><button data-v="still">Parado</button></div>
  <div class="group" data-key="clip"><span>Trecho</span>
    <button data-v="float" data-subject="betta">Flutuando</button><button data-v="turn" data-subject="betta">Virada</button>
    <button data-v="bloom" data-subject="flor gerbera dalia florescer">Abrir e fechar</button><button data-v="once" data-subject="flor gerbera dalia">Abrir uma vez</button>
    <button data-v="swim" data-subject="peixe">Nadando</button><button data-v="loop" data-subject="gatinho gatinho2">Loop</button></div>
  <div class="group"><button id="replay">↻ Repetir</button></div>
</div>

<script>
// Foto licenciada: fica fora do git (ver .gitignore). Abra a página por um servidor local
// (ex.: launch "pontilhismo-proto"), não por file://, senão o canvas não consegue ler os pixels.
const IMAGES = [{ src: "betta.jpg" }];
const RISO = { rosa: [255,72,176], verde: [18,161,128], limao: [245,238,74], azul: [11,143,224], noite: [27,31,59], branco: [255,255,255] };
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r => r.map(v => v / 16 - 0.5));
const CHARS = " .:-=+*#%@";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DEBUG = new URLSearchParams(location.search).has("debug"); // ?debug pinta as regiões de nadadeira

const state = { subject: "betta", style: "dots", colors: "original", bg: "noite", reveal: "stroke", motion: "video", clip: "turn", img: 0 };
{ // ?tema=flor (lírio), ?tema=gerbera, ?tema=dalia, ?tema=florescer, ?tema=peixe (betta em loop), ?tema=gatinho, ?tema=gatinho2 ou ?tema=olho abre direto no tema
  // o trecho vem de defaultClip, mais abaixo (aplicado logo depois dele)
  state.subject = new URLSearchParams(location.search).get("tema") || state.subject;
}
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
let particles = [];
let startTime = 0;
let cell = 8;
let view = { k: 1, cx: 0, cy: 0 }; // escala imagem → tela e centro do peixe na tela
const mouse = { x: -1e4, y: -1e4 };
const sources = [];

// ---------- carregamento e análise da imagem ----------
function loadImage(src) {
  // foto faltando resolve null: os temas de vídeo seguem funcionando sem ela
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}

/** Foto em fundo preto: brilho = presença do peixe. As bordas escuras das nadadeiras somem aos poucos. */
function inkBlackBg(r, g, b) {
  const m = Math.max(r, g, b) / 255;
  return Math.min(1, Math.max(0, (m - 0.09) / 0.16));
}

function analyse(im) {
  const c = document.createElement("canvas");
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const x = c.getContext("2d"); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  // caixa do peixe por percentis (1%–99%): ignora ruído solto no fundo
  const xs = [], ys = [];
  for (let y = 0; y < c.height; y += 2) for (let xx = 0; xx < c.width; xx += 2) {
    const i = (y * c.width + xx) * 4;
    if (inkBlackBg(d[i], d[i+1], d[i+2]) > 0.5) { xs.push(xx); ys.push(y); }
  }
  xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
  const q = (arr, f) => arr[Math.floor(arr.length * f)] || 0;
  const x0 = q(xs, 0.01), x1 = q(xs, 0.99), y0 = q(ys, 0.01), y1 = q(ys, 0.99);
  const padX = (x1 - x0) * 0.03, padY = (y1 - y0) * 0.03;
  const bx = Math.max(0, x0 - padX), by = Math.max(0, y0 - padY);
  return { im, box: { x: bx, y: by, w: Math.min(c.width, x1 + padX) - bx, h: Math.min(c.height, y1 + padY) - by } };
}

// ---------- cores ----------
function nearest(rgb, pal) {
  let best = pal[0], bd = 1e9;
  for (const p of pal) { const d = (rgb[0]-p[0])**2*0.3 + (rgb[1]-p[1])**2*0.59 + (rgb[2]-p[2])**2*0.11; if (d < bd) { bd = d; best = p; } }
  return best;
}
function paletteFor() {
  const base = [RISO.rosa, RISO.verde, RISO.limao, RISO.azul];
  return base.concat([state.bg === "branco" ? RISO.noite : RISO.branco]);
}
const NEUTRO = [201, 204, 216]; // cinza frio: escamas prateadas sobre fundo branco não somem
function colorFor(rgb, gx, gy) {
  const t = BAYER[gy & 3][gx & 3];
  const lumIn = (0.3 * rgb[0] + 0.59 * rgb[1] + 0.11 * rgb[2]) / 255;
  const sat = (Math.max(...rgb) - Math.min(...rgb)) / (Math.max(...rgb) || 1);
  if (state.bg === "branco" && lumIn > 0.7 && sat < 0.18) return NEUTRO.map(v => Math.round(v - (1 - lumIn) * 120));
  if (state.colors === "riso") {
    const spread = state.style === "dither" ? 90 : 40;
    return nearest(rgb.map(v => v + t * spread), paletteFor());
  }
  if (state.style === "dither") return rgb.map(v => Math.round((v / 255 + t * 0.33) * 3) / 3 * 255);
  return rgb;
}

// ---------- anatomia (coordenadas da foto, 2000×1333) ----------
/**
 * O corpo é uma cápsula ao longo da coluna (focinho → base da cauda), com raio
 * variável. Tudo que fica fora dela é nadadeira e ondula; quanto mais longe do
 * corpo, mais solto. A peitoral (atrás da guelra) ganha uma batida própria.
 */
const ANAT = {
  spineA: [300, 772],   // perto do focinho
  spineB: [1160, 540],  // base da cauda (pedúnculo)
  radius: [95, 140, 78], // meia-altura do corpo: cabeça, meio, pedúnculo
  // nadadeiras que ficam por cima do corpo na foto: giram em volta da própria base
  flaps: [
    { center: [650, 770], r: 150, base: [555, 725], hz: 2.4, angle: 0.22, phase: 0 },   // peitoral (leque atrás da guelra)
    { center: [865, 715], r: 125, base: [935, 615], hz: 0.7, angle: 0.16, phase: 1.3 }, // ventral laranja
  ],
};
function bodyRadius(t) {
  const [a, m, b] = ANAT.radius;
  return t < 0.5 ? a + (m - a) * (t / 0.5) : m + (b - m) * ((t - 0.5) / 0.5);
}
/** Para um ponto da foto: peso de nadadeira, distância até o corpo e direções para fora/tangente. */
function anatomyAt(ix, iy) {
  const [ax, ay] = ANAT.spineA, [bx, by] = ANAT.spineB;
  const sx = bx - ax, sy = by - ay, len = Math.hypot(sx, sy), ux = sx / len, uy = sy / len;
  const rx = ix - ax, ry = iy - ay;
  const t = (rx * ux + ry * uy) / len, perp = rx * -uy + ry * ux; // perp > 0 = barriga
  let dist, ox, oy;
  if (t > 1) {
    // atrás do pedúnculo: a cauda abre em leque a partir dele
    const dx = ix - bx, dy = iy - by, r = Math.hypot(dx, dy) || 1;
    dist = Math.max(0, r - ANAT.radius[2]); ox = dx / r; oy = dy / r;
  } else {
    const s = perp >= 0 ? 1 : -1;
    dist = Math.max(0, Math.abs(perp) - bodyRadius(Math.max(0, t)));
    ox = -uy * s; oy = ux * s;
  }
  const fin = Math.min(1, dist / 70); // 0 no corpo, 1 a 70px da borda
  let flap = -1, flapW = 0;
  ANAT.flaps.forEach((f, i) => {
    const w = Math.max(0, 1 - Math.hypot(ix - f.center[0], iy - f.center[1]) / f.r);
    const sw = w * w * (3 - 2 * w); // borda suave
    if (sw > flapW) { flapW = sw; flap = i; }
  });
  return { t, dist, fin, ox, oy, flap, flapW, tail: t > 1 ? 1 : Math.max(0, (t - 0.75) / 0.25) };
}

// ---------- construção das partículas ----------
function buildTargets(src) {
  cell = state.style === "dither" ? Math.max(3, Math.round(W / 210)) : Math.max(4, Math.round(W / 140));
  const pad = 0.84; // folga para as nadadeiras ondularem sem cortar
  const s = Math.min(W * pad / src.box.w, H * pad / src.box.h);
  const cols = Math.floor(src.box.w * s / cell), rows = Math.floor(src.box.h * s / cell);
  if (cols < 2 || rows < 2) return [];
  const ox = (W - cols * cell) / 2, oy = (H - rows * cell) / 2;
  view = { k: (cols * cell) / src.box.w, cx: W / 2, cy: H / 2 };
  const c = document.createElement("canvas"); c.width = cols; c.height = rows;
  const x = c.getContext("2d"); x.imageSmoothingQuality = "high";
  x.drawImage(src.im, src.box.x, src.box.y, src.box.w, src.box.h, 0, 0, cols, rows);
  const d = x.getImageData(0, 0, cols, rows).data;

  const grid = new Int32Array(cols * rows).fill(-1);
  const out = [];
  for (let gy = 0; gy < rows; gy++) for (let gx = 0; gx < cols; gx++) {
    const i = (gy * cols + gx) * 4;
    const ink = inkBlackBg(d[i], d[i+1], d[i+2]);
    if (ink < 0.3) continue;
    if (state.style === "dither" && ink < 0.5 + BAYER[gy & 3][gx & 3]) continue;
    const rgb = colorFor([d[i], d[i+1], d[i+2]], gx, gy);
    const lum = (0.3 * d[i] + 0.59 * d[i+1] + 0.11 * d[i+2]) / 255;
    const ix = src.box.x + (gx + 0.5) / cols * src.box.w, iy = src.box.y + (gy + 0.5) / rows * src.box.h;
    grid[gy * cols + gx] = out.length;
    out.push({ gx, gy, tx: ox + gx * cell + cell / 2, ty: oy + gy * cell + cell / 2, rgb, ink, lum, order: 0, a: anatomyAt(ix, iy) });
  }
  orderReveal(out, grid, cols, rows);
  return out;
}

/** Ordem de entrada. "Pincelada" percorre a mancha por vizinhança (BFS), como um pincel passando. */
function orderReveal(pts, grid, cols, rows) {
  if (!pts.length) return;
  if (state.reveal === "grow") { pts.forEach(p => p.order = 1 - p.gy / rows + Math.random() * 0.08); return normalize(pts); }
  if (state.reveal === "gather") { pts.forEach(p => p.order = Math.random()); return; }
  const dist = new Float32Array(pts.length).fill(-1);
  const byX = pts.map((_, i) => i).sort((a, b) => pts[a].gx - pts[b].gx);
  let base = 0;
  for (const seed of byX) {
    if (dist[seed] >= 0) continue;
    const q = [seed]; dist[seed] = base; let maxD = base;
    for (let h = 0; h < q.length; h++) {
      const p = pts[q[h]];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = p.gx + dx, ny = p.gy + dy;
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        const n = grid[ny * cols + nx];
        if (n >= 0 && dist[n] < 0) { dist[n] = dist[q[h]] + 1; if (dist[n] > maxD) maxD = dist[n]; q.push(n); }
      }
    }
    base = maxD * 0.6; // manchas soltas começam antes da anterior terminar
  }
  pts.forEach((p, i) => p.order = dist[i] + Math.random() * 4);
  normalize(pts);
}
function normalize(pts) {
  let mx = 0; for (const p of pts) mx = Math.max(mx, p.order);
  for (const p of pts) p.order /= mx || 1;
}

function makeParticles(targets) {
  const list = targets.map(t => {
    let sx = t.tx, sy = t.ty;
    if (state.reveal === "gather") { const a = Math.random() * 6.283, r = Math.max(W, H) * (0.6 + Math.random() * 0.5); sx = W / 2 + Math.cos(a) * r; sy = H / 2 + Math.sin(a) * r; }
    if (state.reveal === "grow") sy = t.ty + cell * 3;
    return { ...t, x: sx, y: sy, sx, sy, ch: "", vx: 0, vy: 0, ox: 0, oy: 0 };
  });
  list.forEach(p => p.ch = pickChar(p));
  return list;
}
function pickChar(p) {
  // mais "denso" onde a cor é mais escura/saturada
  const k = Math.min(CHARS.length - 1, 2 + Math.floor((1 - p.lum) * 5 + p.ink * 3 + Math.random() * 1.5));
  return CHARS[k];
}

// ---------- movimento ----------
/**
 * Betta parado na água: o corpo flutua e inclina devagar; as nadadeiras
 * ondulam como tecido, com ondas que saem do corpo para as pontas; a peitoral
 * bate rápido. Valores em pixels da foto (a escala para a tela vem de view.k).
 */
const MOTION = {
  hoverY: 10, hoverX: 7, hoverMs: [3400, 4700], // flutuação do corpo inteiro
  pitch: 0.018, pitchMs: 5200,                  // inclinação (rad)
  finAmp: 26,       // ondulação na ponta das nadadeiras
  finReach: 420,    // distância do corpo em que a ondulação chega ao máximo
  finHz: 0.55,      // velocidade da onda nas nadadeiras
  finWave: 0.011,   // número de onda (rad por px de distância do corpo)
  tailAmp: 1.25,    // a cauda ondula um pouco mais que as outras
  wag: 7,           // leve balanço do pedúnculo
};
/** Deslocamento (em px da foto) de um ponto, no tempo s (segundos). */
function finOffset(a, s, out) {
  const M = MOTION;
  let dx = 0, dy = 0;
  if (a.fin > 0) {
    const reach = Math.min(1, a.dist / M.finReach);
    const amp = M.finAmp * Math.pow(reach, 1.35) * (1 + (M.tailAmp - 1) * a.tail) * a.fin;
    // a fase varia ao longo da borda do corpo (a.t), então as ondas não andam em bloco
    const ph = 2 * Math.PI * M.finHz * s - a.dist * M.finWave + a.t * 4.2;
    const tx = -a.oy, ty = a.ox; // tangente à borda
    const sway = Math.sin(ph) + 0.35 * Math.sin(2.3 * ph + a.dist * 0.02 + 1.1); // harmônico para "tremular"
    const breathe = 0.3 * Math.sin(ph * 0.6 + 1.7);
    dx += (tx * sway + a.ox * breathe) * amp;
    dy += (ty * sway + a.oy * breathe) * amp;
  }
  if (a.tail > 0) dy += Math.sin(2 * Math.PI * M.finHz * s * 1.3) * M.wag * a.tail * (1 - a.fin);
  out.x = dx; out.y = dy;
  const f = a.flap >= 0 ? ANAT.flaps[a.flap] : null;
  out.flap = a.flap; out.rot = f ? f.angle * a.flapW * Math.sin(2 * Math.PI * f.hz * s + f.phase) : 0;
  return out;
}

// ---------- vídeo ----------
/** Vai-e-volta: r segundos percorridos dentro de um trecho de len segundos → 0..len. */
const pingPong = (r, len) => { const u = (r % (2 * len)) / len; return (u < 1 ? u : 2 - u) * len; };
const easeInOut = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;

/** Fundo preto do vídeo do betta: brilho = peixe. Exige um pouco de cor para não desenhar as bolhas (cinza). */
function inkVideo(r, g, b) {
  const mx = Math.max(r, g, b) / 255, mn = Math.min(r, g, b) / 255;
  const sat = mx > 0 ? (mx - mn) / mx : 0;
  return Math.min(1, Math.max(0, (mx - 0.09) / 0.16)) * Math.min(1, Math.max(0, (sat - 0.12) / 0.15));
}
/**
 * Fundo claro: tinta = saturação. Só o colorido vira ponto; brilhos brancos e sombras
 * cinzas ficam de fora. Abaixo de `min` não desenha; `min + range` já é tinta cheia.
 */
const inkSat = (min, range) => (r, g, b) => {
  const mx = Math.max(r, g, b) / 255, mn = Math.min(r, g, b) / 255;
  const sat = mx > 0 ? (mx - mn) / mx : 0;
  return Math.min(1, Math.max(0, (sat - min) / range));
};
// lírio: fundo rosado (~0,05) e pétalas em 0,4–0,6, então o corte pode ser alto
const inkLirio = inkSat(0.2, 0.1);
// gérbera: fundo branco puro (~0,02) e pétalas bem claras (a partir de ~0,05)
const inkGerbera = inkSat(0.045, 0.05);
// gatinho: fundo lilás quase branco (medido: min 0,04, range 0,04)
const inkGatinho = inkSat(0.04, 0.04);
// florescer: fundo branco (medido: min 0,04, range 0,04)
const inkFlorescer = inkSat(0.04, 0.04);
/**
 * Fundo branco com tema cinza (sem cor): tinta = distância do branco (canal mais
 * claro escurecendo). Abaixo de `min` não desenha; `min + range` já é tinta cheia.
 */
const inkDark = (min, range) => (r, g, b) => {
  const dark = 1 - Math.min(r, g, b) / 255;
  return Math.min(1, Math.max(0, (dark - min) / range));
};
// gatinho2: gato malhado cinza em fundo branco puro — saturação não pega o pelo
const inkGatinho2 = inkDark(0.06, 0.12);
/** Dália em fundo preto: brilho = flor (o caule é cinza, então não dá para exigir cor). */
function inkDalia(r, g, b) {
  // o fundo do vídeo é preto puro (0) e o miolo é roxo quase preto (~0,05): o corte fica bem baixo
  return Math.min(1, Math.max(0, (Math.max(r, g, b) / 255 - 0.012) / 0.03));
}
/**
 * Betta em loop (betta-loop.mp4), fundo preto: brilho = peixe (medido: min 0,016, range 0,04).
 * Exige vermelho (r acima de g e b) para não desenhar a coluna de bolhas, que é cinza-azulada.
 */
function inkBettaLoop(r, g, b) {
  const mx = Math.max(r, g, b) / 255, red = (r - Math.max(g, b)) / 255;
  return Math.min(1, Math.max(0, (mx - 0.016) / 0.04)) * Math.min(1, Math.max(0, (red - 0.02) / 0.06));
}
/**
 * Cores mais vivas: aumenta a saturação (HSL) e, no fundo branco, escurece um pouco
 * para as pétalas claras não sumirem. Usado na flor, cujas cores são pastel.
 */
function vivid(rgb, k, detail = 0) {
  const [r, g, b] = rgb.map(v => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  let h = 0, l = (mx + mn) / 2, s = mx === mn ? 0 : (mx - mn) / (l > 0.5 ? 2 - mx - mn : mx + mn);
  if (mx !== mn) { const d = mx - mn; h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
  s = Math.min(1, s * k.sat);

  return pose;
}

/**
 * Bolhas: no vídeo do betta sobe uma coluna fina de bolhas, às vezes com reflexo
 * vermelho. O peixe é uma mancha grande e contínua; as bolhas são pontos soltos.
 * Marca as células com tinta e guarda só as manchas grandes (vizinhança de 8).
 * Devolve null quando não precisa filtrar.
 */
let keepMask = null, labelBuf = null, stackBuf = null;
function bigBlobs(g, d) {
  if (g.clip.mode !== "swim" && g.clip.mode !== "loop") return null;
  const n = g.cols * g.rows, cols = g.cols, rows = g.rows;
  if (!keepMask || keepMask.length !== n) { keepMask = new Uint8Array(n); labelBuf = new Int32Array(n); stackBuf = new Int32Array(n); }
  const lit = keepMask; // reaproveita: 1 = tinta, depois vira 1 = manter
  for (let i = 0; i < n; i++) lit[i] = g.S.ink(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]) >= 0.3 ? 1 : 0;
  labelBuf.fill(0);
  const sizes = [0];
  for (let i = 0; i < n; i++) {
    if (!lit[i] || labelBuf[i]) continue;
    const id = sizes.length; let top = 0, size = 0;
    stackBuf[top++] = i; labelBuf[i] = id;
    while (top) {
      const j = stackBuf[--top], x = j % cols, y = (j / cols) | 0; size++;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        const k = ny * cols + nx;
        if (lit[k] && !labelBuf[k]) { labelBuf[k] = id; stackBuf[top++] = k; }
      }
    }
    sizes.push(size);
  }
  const min = Math.max(25, 0.06 * Math.max(...sizes));
  for (let i = 0; i < n; i++) lit[i] = labelBuf[i] && sizes[labelBuf[i]] >= min ? 1 : 0;
  return lit;
}

/**
 * Realce de borda: luminosidade do ponto menos a média dos vizinhos (só vizinhos com tinta,
 * para a silhueta não ganhar contorno). > 0 = mais claro que em volta, < 0 = vinco/sombra.
 */
function edgeDetail(g, d, gx, gy) {
  const L = i => (Math.max(d[i], d[i+1], d[i+2]) + Math.min(d[i], d[i+1], d[i+2])) / 510;
  const c = (gy * g.cols + gx) * 4;
  let sum = 0, n = 0;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const x = gx + dx, y = gy + dy;
    if (x < 0 || y < 0 || x >= g.cols || y >= g.rows) continue;
    const i = (y * g.cols + x) * 4;
    if (g.S.ink(d[i], d[i+1], d[i+2]) < 0.3) continue;
    sum += L(i); n++;
  }
  return n ? L(c) - sum / n : 0;
}

function renderVideo(now) {
  const g = vgrid, ink = g.S.ink;
  const ps = videoPose(g, now), d = sampleVideo(g, ps), t = ps.revealMs;
  let keep = bigBlobs(g, d), d2 = null, keep2 = null, u = 1;
  if (ps.mix) { // emenda do loop: segundo quadro (o fim do trecho)
    keep = keep && keep.slice(); u = easeInOut(ps.mix.u);
    d2 = sampleVideo(g, ps.mix); keep2 = bigBlobs(g, d2);
  }
  const mr = 70;
  for (const p of g.particles) {
    const e = REDUCED ? 1 : ease((t - p.order * REVEAL_MS) / EACH_MS);
    if (e <= 0) continue;
    const cellIdx = p.gy * g.cols + p.gx;
    // na emenda, este ponto ainda mostra o fim do trecho até passar do seu sorteio
    if (p.rnd === undefined) p.rnd = Math.random();
    const late = d2 && p.rnd > u, src = late ? d2 : d, kp = late ? keep2 : keep;
    if (kp && !kp[cellIdx]) continue;
    const i = cellIdx * 4, r = src[i], gg = src[i+1], b = src[i+2];
    const k = ink(r, gg, b);
    if (k < 0.3) continue;
    if (state.style === "dither" && k < 0.5 + BAYER[p.gy & 3][p.gx & 3]) continue;
    const rgb = g.S.vivid ? vivid([r, gg, b], g.S.vivid, edgeDetail(g, d, p.gx, p.gy)) : [r, gg, b];
    // densidade do caractere segue o tom final: no branco, o escuro ganha caractere denso;
    // no azul-noite, o claro (pickChar põe mais "tinta" onde lum é baixo)
    const lum = (0.3 * rgb[0] + 0.59 * rgb[1] + 0.11 * rgb[2]) / 255;
    p.ink = k; p.lum = state.bg === "branco" ? lum : 1 - lum;
    // o caractere foi escolhido com outro tom (pétala que surge ao abrir, sombra que passa): escolhe de novo
    if (p.chInk === undefined || Math.abs(p.ink - p.chInk) > 0.25 || Math.abs(p.lum - p.chLum) > 0.2) { p.ch = pickChar(p); p.chInk = p.ink; p.chLum = p.lum; }
    const dx = p.x - mouse.x, dy = p.y - mouse.y, dd = dx * dx + dy * dy;
    if (dd < mr * mr && !REDUCED) { const f = (1 - Math.sqrt(dd) / mr) * 2.2; p.vx += dx / (Math.sqrt(dd) + 1) * f; p.vy += dy / (Math.sqrt(dd) + 1) * f; }
    p.vx *= 0.86; p.vy *= 0.86;
    p.ox = p.ox * 0.9 + p.vx; p.oy = p.oy * 0.9 + p.vy;
    const atRest = p.sx === p.tx && p.sy === p.ty;
    p.x = (atRest ? p.tx : p.sx + (p.tx - p.sx) * e) + p.ox;
    p.y = (atRest ? p.ty : p.sy + (p.ty - p.sy) * e) + p.oy;
    drawParticle(p, colorFor(rgb, p.gx, p.gy), e, !REDUCED);
  }
}

// ---------- olho ----------
/**
 * Olho feito em código (sem vídeo), inspirado num globo ocular rosado de íris
 * verde-acinzentada. É uma esfera: para cada célula da grade acha o ponto da
 * superfície, gira para as coordenadas do olho e decide se é pupila, íris ou
 * "branco" rosado com veias. Como a esfera gira de verdade, a íris achata quando
 * ele olha para o lado. O olhar segue o mouse (em qualquer lugar da janela); sem
 * mouse, ele olha em volta com sacadas. É mole: estica um pouco quando vira rápido.
 */
const EYE = {
  size: 0.4,                // raio, em fração do menor lado do palco
  depth: 2.4,               // distância "virtual" do mouse, em raios (maior = vira menos)
  maxTurn: 0.62,            // giro máximo (rad)
  iris: 0.47, limbus: 0.07, // raio angular da íris e largura do anel escuro da borda (rad)
  pupil: [0.13, 0.23],      // pupila contraída (mouse perto do olho) → dilatada (longe)
  spring: 150, damping: 19, // mola do olhar: rápida, com um leve passar do ponto
  squish: 0.06,             // quanto estica ao virar rápido
  light: [-0.45, -0.55, 0.7],
  // no fundo branco o rosado claro some: satura e escurece (mesma função das flores)
  onWhite: { sat: 1.12, tone: [0.05, 1], onWhite: [0.1, 0.74], onDark: [0, 1], edge: 0 },
  c: {
    scleraFront: [248, 206, 198], scleraBack: [214, 124, 130], vein: [176, 40, 58],
    iris: [112, 142, 128], irisLight: [178, 198, 172], irisWarm: [186, 152, 96],
    limbus: [36, 50, 50], pupil: [12, 10, 16],
  },
};
const VT_W = 512, VT_H = 256; // textura das veias: x = ângulo em volta da íris, y = distância da íris
let veinTex = null, eyeGrid = null;
const gaze = { yaw: 0, pitch: 0, vy: 0, vp: 0, pupil: 0.18, last: 0, wander: { yaw: 0, pitch: 0, next: 0 } };

/** Veias: nascem atrás do olho e correm em direção à íris, se ramificando e afinando. */
function buildVeins() {
  const c = document.createElement("canvas"); c.width = VT_W; c.height = VT_H;
  const x = c.getContext("2d"); x.lineCap = "round"; x.strokeStyle = "#fff";
  const stopY = 0.66 / Math.PI * VT_H; // somem um pouco antes da íris
  const grow = (px, py, w, dir) => {
    while (py > stopY && w > 0.35) {
      const nx = px + dir * 3, ny = py - 3;
      x.globalAlpha = Math.min(1, w / 1.4); x.lineWidth = w;
      for (const k of [-VT_W, 0, VT_W]) { x.beginPath(); x.moveTo(px + k, py); x.lineTo(nx + k, ny); x.stroke(); }
      dir = Math.max(-1.2, Math.min(1.2, dir + (Math.random() - 0.5) * 0.7));
      w *= 0.975;
      if (Math.random() < 0.05) grow(nx, ny, w * 0.7, dir + (Math.random() < 0.5 ? -0.8 : 0.8));
      px = nx; py = ny;
    }
  };
  for (let i = 0; i < 16; i++) grow(Math.random() * VT_W, (1.3 + Math.random() * 0.9) / Math.PI * VT_H, 1 + Math.random() * 1.3, (Math.random() - 0.5) * 0.6);
  const d = x.getImageData(0, 0, VT_W, VT_H).data, out = new Float32Array(VT_W * VT_H);
  for (let i = 0; i < out.length; i++) out[i] = d[i * 4] / 255;
  return out;
}

/** Grade só no disco do olho (com folga para ele esticar). */
function buildEyeGrid(now) {
  if (!veinTex) veinTex = buildVeins();
  cell = state.style === "dither" ? Math.max(3, Math.round(W / 210)) : Math.max(4, Math.round(W / 140));
  const cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
  const ox = (W - cols * cell) / 2, oy = (H - rows * cell) / 2;
  const R = Math.min(W, H) * EYE.size, cx = W / 2, cy = H / 2;
  const grid = new Int32Array(cols * rows).fill(-1), lit = [];
  for (let gy = 0; gy < rows; gy++) for (let gx = 0; gx < cols; gx++) {
    const tx = ox + gx * cell + cell / 2, ty = oy + gy * cell + cell / 2;
    if (Math.hypot(tx - cx, ty - cy) > R * 1.12) continue;
    grid[gy * cols + gx] = lit.length;
    lit.push({ gx, gy, tx, ty, ink: 1, lum: 0.5, order: 0 });
  }
  orderReveal(lit, grid, cols, rows);
  return { R, cx, cy, start: now, particles: makeParticles(lit), f: {} };
}

/** Para onde olhar agora: mola até o alvo (mouse ou passeio). Prepara o quadro em g.f. */
function updateGaze(g, now) {
  const dt = Math.min(0.05, (now - (gaze.last || now)) / 1000); gaze.last = now;
  let ty, tp, near = 1;
  if (mouse.x > -1e3) {
    const dx = mouse.x - g.cx, dy = mouse.y - g.cy, D = EYE.depth * g.R;
    ty = Math.atan2(dx, D); tp = Math.atan2(dy, D);
    near = Math.min(1, Math.hypot(dx, dy) / (g.R * 3));
  } else {
    if (now > gaze.wander.next) {
      gaze.wander.yaw = (Math.random() - 0.5) * 1.1; gaze.wander.pitch = (Math.random() - 0.5) * 0.7;
      gaze.wander.next = now + 800 + Math.random() * 2200;
    }
    ty = gaze.wander.yaw; tp = gaze.wander.pitch;
  }
  const m = Math.hypot(ty, tp);
  if (m > EYE.maxTurn) { ty *= EYE.maxTurn / m; tp *= EYE.maxTurn / m; }
  if (REDUCED) { gaze.yaw = ty; gaze.pitch = tp; gaze.vy = gaze.vp = 0; }
  else {
    gaze.vy += ((ty - gaze.yaw) * EYE.spring - gaze.vy * EYE.damping) * dt;
    gaze.vp += ((tp - gaze.pitch) * EYE.spring - gaze.vp * EYE.damping) * dt;
    gaze.yaw += gaze.vy * dt; gaze.pitch += gaze.vp * dt;
  }
  const [p0, p1] = EYE.pupil;
  gaze.pupil += (p0 + (p1 - p0) * near - gaze.pupil) * Math.min(1, dt * 4);
  // valores do quadro: giro, flutuação, respiração e esticão na direção do movimento
  const f = g.f, sp = Math.hypot(gaze.vy, gaze.vp), s = now / 1000;
  f.cy = Math.cos(gaze.yaw); f.sy = Math.sin(gaze.yaw); f.cp = Math.cos(gaze.pitch); f.sp = Math.sin(gaze.pitch);
  f.fx = REDUCED ? 0 : Math.sin(s * 0.9) * g.R * 0.02; f.fy = REDUCED ? 0 : Math.sin(s * 0.63 + 1) * g.R * 0.025;
  f.br = REDUCED ? 0 : 0.012 * Math.sin(s * 1.7);
  f.st = REDUCED ? 0 : Math.min(EYE.squish, sp * 0.02);
  f.dx = sp > 1e-4 ? gaze.vy / sp : 1; f.dy = sp > 1e-4 ? gaze.vp / sp : 0;
  f.pupil = gaze.pupil * (REDUCED ? 1 : 1 + 0.04 * Math.sin(s * 1.3));
  const L = EYE.light, ll = Math.hypot(...L);
  f.L = L.map(v => v / ll);
  const hz = f.L[2] + 1, hl = Math.hypot(f.L[0], f.L[1], hz);
  f.H = [f.L[0] / hl, f.L[1] / hl, hz / hl];
}

const eyeRgb = [0, 0, 0];
const mixc = (a, b, t, o) => { o[0] = a[0] + (b[0] - a[0]) * t; o[1] = a[1] + (b[1] - a[1]) * t; o[2] = a[2] + (b[2] - a[2]) * t; return o; };
const tmpA = [0, 0, 0];
/** Cor do olho no ponto (x, y) da tela, em eyeRgb. Devolve a cobertura (0 = fora do olho). */
function shadeEye(g, x, y) {
  const f = g.f, C = EYE.c;
  let u = (x - g.cx - f.fx) / g.R, v = (y - g.cy - f.fy) / g.R;
  // mole: estica na direção em que está virando e afina na outra; respira de leve
  const a = (u * f.dx + v * f.dy) / (1 + f.st), b = (-u * f.dy + v * f.dx) / (1 - f.st * 0.5);
  u = (a * f.dx - b * f.dy) / (1 + f.br); v = (a * f.dy + b * f.dx) / (1 - f.br);
  const r2 = u * u + v * v, r = Math.sqrt(r2);
  const cover = Math.min(1, Math.max(0, (1 - r) * g.R / cell + 0.5));
  if (cover <= 0) return 0;
  const nz = Math.sqrt(Math.max(0, 1 - r2));
  // da tela para o olho: desfaz o giro (yaw em y, depois pitch em x)
  const x1 = u * f.cy - nz * f.sy, z1 = u * f.sy + nz * f.cy;
  const y2 = v * f.cp - z1 * f.sp, z2 = v * f.sp + z1 * f.cp;
  const theta = Math.acos(Math.max(-1, Math.min(1, z2))), phi = Math.atan2(y2, x1);
  const P = f.pupil, I = EYE.iris;
  const inIris = theta < I;
  if (theta < P) {
    mixc(C.pupil, C.pupil, 0, eyeRgb);
  } else if (inIris) {
    const q = (theta - P) / (I - P);
    const fib = 0.5 + 0.3 * Math.sin(phi * 41 + 2.3 * Math.sin(phi * 7)) + 0.2 * Math.sin(phi * 97 + q * 6);
    mixc(C.iris, C.irisLight, Math.max(0, Math.min(1, fib)) * 0.8, eyeRgb);
    mixc(eyeRgb, C.irisWarm, Math.max(0, 1 - q / 0.32) * 0.75, eyeRgb); // anel quente em volta da pupila
    mixc(eyeRgb, C.limbus, smoothstep(I - EYE.limbus, I, theta), eyeRgb); // borda escura
    mixc(eyeRgb, C.pupil, Math.max(0, 1 - q / 0.08) * 0.6, eyeRgb);      // pupila com borda macia
  } else {
    mixc(C.scleraFront, C.scleraBack, smoothstep(0.55, 1.9, theta), eyeRgb);
    const tx = Math.floor(((phi / 6.2832) % 1 + 1) % 1 * VT_W) % VT_W, ty = Math.min(VT_H - 1, Math.floor(theta / Math.PI * VT_H));
    mixc(eyeRgb, C.vein, veinTex[ty * VT_W + tx] * 0.6, eyeRgb);
    mixc(eyeRgb, mixc(eyeRgb, C.scleraBack, 1, tmpA), (1 - smoothstep(I, I + 0.08, theta)) * 0.35, eyeRgb); // sombra junto da íris
  }
  // luz fixa no mundo (não gira com o olho): difusa, borda mais escura e brilho molhado
  const nd = u * f.L[0] + v * f.L[1] + nz * f.L[2], nh = Math.max(0, u * f.H[0] + v * f.H[1] + nz * f.H[2]);
  const shade = (0.55 + 0.5 * Math.max(0, nd)) * (0.6 + 0.4 * Math.pow(nz, 0.55));
  const spec = Math.pow(nh, 30) * 0.5 + (inIris ? Math.pow(nh, 160) * 0.9 : 0);
  for (let i = 0; i < 3; i++) eyeRgb[i] = Math.min(255, Math.round(eyeRgb[i] * shade + 255 * spec));
  return cover;
}

function renderEye(now) {
  const g = eyeGrid, t = now - g.start, branco = state.bg === "branco";
  updateGaze(g, now);
  for (const p of g.particles) {
    const e = REDUCED ? 1 : ease((t - p.order * REVEAL_MS) / EACH_MS);
    if (e <= 0) continue;
    const cover = shadeEye(g, p.tx, p.ty);
    if (cover < 0.3) continue;
    const rgb = branco ? vivid(eyeRgb, EYE.onWhite) : eyeRgb.slice();
    const lum = (0.3 * rgb[0] + 0.59 * rgb[1] + 0.11 * rgb[2]) / 255;
    // meio-tom: ponto maior onde tem mais "tinta" (escuro no branco, claro no azul-noite)
    const ink = cover * (0.3 + 0.7 * (branco ? 1 - lum : lum));
    if (state.style === "dither" && ink < 0.5 + BAYER[p.gy & 3][p.gx & 3]) continue;
    p.ink = ink; p.lum = branco ? lum : 1 - lum;
    if (p.chInk === undefined || Math.abs(p.ink - p.chInk) > 0.25 || Math.abs(p.lum - p.chLum) > 0.2) { p.ch = pickChar(p); p.chInk = p.ink; p.chLum = p.lum; }
    const atRest = p.sx === p.tx && p.sy === p.ty;
    p.x = atRest ? p.tx : p.sx + (p.tx - p.sx) * e;
    p.y = atRest ? p.ty : p.sy + (p.ty - p.sy) * e;
    drawParticle(p, colorFor(rgb, p.gx, p.gy), e, !REDUCED);
  }
}

// ---------- desenho ----------
const ease =t => t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);
const REVEAL_MS = 2600, EACH_MS = 700;
const off = { x: 0, y: 0, flap: -1, rot: 0 };

function drawParticle(p, c, alpha, moving) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
  if (state.style === "chars") {
    if (!p.ch || (moving && Math.random() < 0.004)) p.ch = pickChar(p);
    ctx.fillText(p.ch, p.x, p.y);
  } else if (state.style === "dots") {
    const r = cell * 0.5 * (0.45 + 0.55 * p.ink);
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();
  } else {
    ctx.fillRect(p.x - cell / 2, p.y - cell / 2, cell, cell);
  }
}

function frame(now) {
  const t = now - startTime, s = now / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const fs = cell * 1.25;
  if (state.style === "chars") { ctx.font = `600 ${fs}px ui-monospace, Menlo, monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; }
  if (state.subject === "olho") {
    if (!eyeGrid && W > 10) eyeGrid = buildEyeGrid(now);
    if (eyeGrid) {
      if (state.style === "chars") ctx.font = `700 ${cell * 1.25}px ui-monospace, Menlo, monospace`;
      renderEye(now);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
    return;
  }
  // modo vídeo: assim que houver o primeiro quadro guardado; sem vídeo, o betta cai na foto.
  // A flor só existe em vídeo: "Ondular"/"Parado" usam o quadro dela aberta.
  const isFlor = state.subject !== "betta", V = vidFor(state.subject);
  if ((state.motion === "video" || isFlor) && !V.failed) {
    if (!vgrid && V.frames.length && W > 10) vgrid = buildVideoGrid(now);
    if (vgrid) {
      if (state.style === "chars") { ctx.font = `${vgrid.S.vivid ? 800 : 600} ${cell * 1.25}px ui-monospace, Menlo, monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; }
      renderVideo(now);
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
      return;
    }
  }
  if (isFlor || !sources.length) { requestAnimationFrame(frame); return; } // flor carregando ou foto faltando
  const moving = !REDUCED && state.motion === "wave";
  const M = MOTION, k = view.k;
  // corpo inteiro: flutua e inclina
  const hx = moving ? Math.sin(now / M.hoverMs[1] * 6.283) * M.hoverX * k : 0;
  const hy = moving ? Math.sin(now / M.hoverMs[0] * 6.283) * M.hoverY * k : 0;
  const pitch = moving ? Math.sin(now / M.pitchMs * 6.283) * M.pitch : 0;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  // base de cada nadadeira solta, na tela, para girar em volta dela
  const src = sources[state.img];
  const bases = ANAT.flaps.map(f => [view.cx + (f.base[0] - (src.box.x + src.box.w / 2)) * k, view.cy + (f.base[1] - (src.box.y + src.box.h / 2)) * k]);
  const mr = 70;
  for (const p of particles) {
    const e = REDUCED ? 1 : ease((t - p.order * REVEAL_MS) / EACH_MS);
    if (e <= 0) continue;
    // empurrão do mouse, com mola de volta
    const dx = p.x - mouse.x, dy = p.y - mouse.y, dd = dx * dx + dy * dy;
    if (dd < mr * mr && moving) { const f = (1 - Math.sqrt(dd) / mr) * 2.2; p.vx += dx / (Math.sqrt(dd) + 1) * f; p.vy += dy / (Math.sqrt(dd) + 1) * f; }
    p.vx *= 0.86; p.vy *= 0.86;
    p.ox = p.ox * 0.9 + p.vx; p.oy = p.oy * 0.9 + p.vy;
    let x = p.tx, y = p.ty;
    if (moving) {
      finOffset(p.a, s, off);
      x += off.x * k; y += off.y * k;
      if (off.rot) { // gira em volta da base da nadadeira
        const [bx0, by0] = bases[off.flap], c = Math.cos(off.rot), sn = Math.sin(off.rot), rx = x - bx0, ry = y - by0;
        x = bx0 + rx * c - ry * sn; y = by0 + rx * sn + ry * c;
      }
      const rx = x - view.cx, ry = y - view.cy;
      x = view.cx + rx * cp - ry * sp + hx; y = view.cy + rx * sp + ry * cp + hy;
    }
    // entrada: do ponto inicial até a posição animada
    const bx = p.sx === p.tx && p.sy === p.ty ? x : p.sx + (x - p.sx) * e;
    const by = p.sx === p.tx && p.sy === p.ty ? y : p.sy + (y - p.sy) * e;
    p.x = bx + p.ox; p.y = by + p.oy;
    const c = DEBUG ? [Math.round(255 * (1 - p.a.fin)), Math.round(120 + 135 * p.a.flapW), Math.round(255 * p.a.fin)] : p.rgb;
    drawParticle(p, c, e, moving);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

// ---------- controle ----------
function resize() {
  const r = canvas.getBoundingClientRect();
  DPR = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
}
function rebuild() {
  vgrid = null; eyeGrid = null; // vídeo e olho refazem a grade (e a entrada) no próximo quadro
  if (W <= 10) return;
  if (sources.length) particles = makeParticles(buildTargets(sources[state.img])); // sem foto: só os temas de vídeo
  startTime = performance.now();
}
function syncButtons() {
  document.querySelectorAll(".group[data-key]").forEach(g => g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(state[g.dataset.key] === b.dataset.v))));
  // trechos que não são do tema atual ficam escondidos
  document.querySelectorAll("button[data-subject]").forEach(b => { b.hidden = !b.dataset.subject.split(" ").includes(state.subject); });
  // tema com estilo/fundo fixos: esconde esses grupos
  const only = subject().only || {};
  document.querySelectorAll(".group[data-key]").forEach(g => { g.hidden = g.dataset.key in only; });
  document.body.classList.toggle("escuro", state.bg === "noite");
  document.body.classList.toggle("preto", state.bg === "preto");
  canvas.setAttribute("aria-label", subject().label);
}
document.querySelectorAll(".group[data-key]").forEach(g => g.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || state[g.dataset.key] === b.dataset.v) return;
  const from = state[g.dataset.key];
  state[g.dataset.key] = b.dataset.v;
  if (g.dataset.key === "subject") { state.clip = defaultClip[state.subject]; applyOnly(); }
  syncButtons();
  // entre "Ondular" e "Parado" não precisa refazer a entrada; o resto refaz
  const quiet = g.dataset.key === "motion" && from !== "video" && b.dataset.v !== "video";
  if (!quiet) rebuild();
}));
document.getElementById("replay").addEventListener("click", () => rebuild());
canvas.addEventListener("pointermove", e => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
canvas.addEventListener("pointerleave", () => { if (state.subject !== "olho") mouse.x = mouse.y = -1e4; });
// o olho acompanha o mouse na janela inteira (inclusive em cima dos botões); só perde quando sai da janela
addEventListener("pointermove", e => { if (state.subject !== "olho") return; const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
document.addEventListener("mouseout", e => { if (!e.relatedTarget) mouse.x = mouse.y = -1e4; });
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => { resize(); if (W > 10) rebuild(); }, 150); }).observe(canvas);

(async () => {
  for (const it of IMAGES) { const im = await loadImage(it.src); if (im) sources.push(analyse(im)); }
  applyOnly();
  // ?fundo=preto|branco|noite vence o fundo fixo do tema (para comparar sem editar o tema)
  const fundo = new URLSearchParams(location.search).get("fundo");
  if (["branco", "noite", "preto"].includes(fundo)) state.bg = fundo;
  if (subject().src) vidFor(state.subject); // começa a guardar os quadros do tema inicial; o outro só quando for escolhido
  syncButtons();
  resize(); if (W > 10) rebuild(); requestAnimationFrame(frame);
})();
</script>
</body>
