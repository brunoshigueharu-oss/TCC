<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pontilhismo Base 8</title>
<style>
  :root {
    --branco: #ffffff; --noite: #1b1f3b; --rosa: #ff48b0;
    --verde: #12a180; --limao: #f5ee4a; --azul: #0b8fe0;
    --bg: var(--branco); --fg: var(--noite); --line: #d5d7e0;
  }
  body.escuro { --bg: var(--noite); --fg: var(--branco); --line: #3a3f63; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, sans-serif; transition: background .4s, color .4s; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 20px 32px; border-bottom: 1px solid var(--line); }
  header b { font-size: 18px; letter-spacing: -.02em; }
  .hero { display: grid; grid-template-columns: 1fr 1.1fr; min-height: calc(100vh - 140px); align-items: center; gap: 24px; padding: 0 32px; }
  h1 { font-size: clamp(40px, 6vw, 84px); line-height: .95; letter-spacing: -.04em; font-weight: 800; }
  .hero p { margin-top: 20px; font-size: 18px; max-width: 30ch; opacity: .75; }
  .cta { display: inline-block; margin-top: 28px; padding: 14px 22px; background: var(--verde); color: var(--noite); font-weight: 700; border-radius: 999px; text-decoration: none; }
  .stage { position: relative; height: min(78vh, 760px); }
  canvas { width: 100%; height: 100%; display: block; }
  .controls { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 13px; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(27,31,59,.12); }
  .group { display: flex; gap: 4px; align-items: center; }
  .group span { opacity: .6; margin-right: 4px; }
  button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  @media (max-width: 800px) {
    .hero { grid-template-columns: 1fr; padding: 24px 16px; }
    .controls { position: static; transform: none; margin: 16px auto 24px; box-shadow: none; }
    header { padding: 16px; }
    .stage { height: 60vh; }
  }
</style>
</head>
<body>
<header><b>Base 8</b><span style="opacity:.6;font-size:13px">protótipo · pontilhismo em código</span></header>
<section class="hero">
  <div>
    <h1>Sua imaginação<br>é o limite.</h1>
    <p>Aprenda a forma correta de usar IAs de código no mundo criativo.</p>
    <a class="cta" href="#">Começar agora</a>
  </div>
  <div class="stage"><canvas id="c" aria-label="Imagem desenhada com pontos" role="img"></canvas></div>
</section>

<div class="controls">
  <div class="group" data-key="style"><span>Estilo</span>
    <button data-v="chars">Caracteres</button><button data-v="dots">Pontos</button><button data-v="dither">Dither</button></div>
  <div class="group" data-key="colors"><span>Cores</span>
    <button data-v="riso">Paleta riso</button><button data-v="original">Originais</button></div>
  <div class="group" data-key="bg"><span>Fundo</span>
    <button data-v="branco">Branco</button><button data-v="noite">Azul-noite</button></div>
  <div class="group" data-key="reveal"><span>Entrada</span>
    <button data-v="stroke">Pincelada</button><button data-v="grow">Crescer</button><button data-v="gather">Reunir</button></div>
  <div class="group" data-key="motion"><span>Movimento</span>
    <button data-v="wave">Nadar</button><button data-v="still">Parado</button></div>
  <div class="group"><button id="replay">↻ Repetir</button></div>
</div>

const RISO = { rosa: [255,72,176], verde: [18,161,128], limao: [245,238,74], azul: [11,143,224], noite: [27,31,59], branco: [255,255,255] };
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r => r.map(v => v / 16 - 0.5));
const CHARS = " .:-=+*#%@";

// ---------- carregamento e análise da imagem ----------
function loadImage(src) {
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.src = src; });
}

/** Tinta da pincelada: saturação alta = pincel; branco, cinza e texto preto ficam de fora. */
/** Peixe/recorte em fundo branco: tudo que se afasta do branco conta, inclusive escamas brancas sombreadas. */
function inkWhiteBg(r, g, b) {
  const d = (255 - Math.min(r, g, b)) / 255;
  return Math.min(1, Math.max(0, (d - 0.035) / 0.07));
}
let inkFn = inkOf;
function inkOf(r, g, b) {
  const max = Math.max(r, g, b) / 255, min = Math.min(r, g, b) / 255;
  if (max < 0.04) return 0;
  const sat = (max - min) / max;
  return Math.min(1, Math.max(0, (sat - 0.12) / 0.25));
}

function analyse(im, mask) {
  inkFn = mask === "white" ? inkWhiteBg : inkOf;
  const c = document.createElement("canvas");
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const x = c.getContext("2d"); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  // caixa da pincelada por percentis (2%–98%): ignora molduras finas e respingos soltos
  const xs = [], ys = [];
  for (let y = 0; y < c.height; y += 2) for (let xx = 0; xx < c.width; xx += 2) {
    const i = (y * c.width + xx) * 4;
    if (inkFn(d[i], d[i+1], d[i+2]) > 0.5) { xs.push(xx); ys.push(y); }
  }
  xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
  const q = (arr, f) => arr[Math.floor(arr.length * f)] || 0;
  const x0 = q(xs, 0.02), x1 = q(xs, 0.98), y0 = q(ys, 0.02), y1 = q(ys, 0.98);
  const padX = (x1 - x0) * 0.04, padY = (y1 - y0) * 0.04;
  const bx = Math.max(0, x0 - padX), by = Math.max(0, y0 - padY);
  return { im, mask, box: { x: bx, y: by, w: Math.min(c.width, x1 + padX) - bx, h: Math.min(c.height, y1 + padY) - by } };
}

// ---------- cores ----------
function nearest(rgb, pal) {
  let best = pal[0], bd = 1e9;
  for (const p of pal) { const d = (rgb[0]-p[0])**2*0.3 + (rgb[1]-p[1])**2*0.59 + (rgb[2]-p[2])**2*0.11; if (d < bd) { bd = d; best = p; } }
  return best;
}
function paletteFor() {
  const base = [RISO.rosa, RISO.verde, RISO.limao, RISO.azul];
  return base.concat([state.bg === "branco" ? RISO.noite : RISO.branco]);
}
const NEUTRO = [201, 204, 216]; // cinza frio para o branco do peixe sobre fundo branco
function colorFor(rgb, gx, gy) {
  const t = BAYER[gy & 3][gx & 3];
  const lumIn = (0.3 * rgb[0] + 0.59 * rgb[1] + 0.11 * rgb[2]) / 255;
  const sat = (Math.max(...rgb) - Math.min(...rgb)) / (Math.max(...rgb) || 1);
  if (lumIn > 0.7 && sat < 0.18) {
    const shade = (1 - lumIn) * 1.6 + t * 0.12;
    if (state.bg === "branco") return NEUTRO.map(v => Math.round(v - shade * 90));
    return [255, 255, 255].map(v => Math.round(v - shade * 120));
  }
  if (state.colors === "riso") {
    const spread = state.style === "dither" ? 90 : 40;
    return nearest(rgb.map(v => v + t * spread), paletteFor());
  }
  if (state.style === "dither") return rgb.map(v => Math.round((v / 255 + t * 0.33) * 3) / 3 * 255);
  return rgb;
}

function buildTargets(src) {
  cell = state.style === "dither" ? Math.max(4, Math.round(W / 170)) : Math.max(4, Math.round(W / 95));
  const pad = 0.94;
  const s = Math.min(W * pad / src.box.w, H * pad / src.box.h);
  const cols = Math.floor(src.box.w * s / cell), rows = Math.floor(src.box.h * s / cell);
  if (cols < 2 || rows < 2) return [];
  const ox = (W - cols * cell) / 2, oy = (H - rows * cell) / 2;
  const c = document.createElement("canvas"); c.width = cols; c.height = rows;
  const x = c.getContext("2d"); x.imageSmoothingQuality = "high";
  x.drawImage(src.im, src.box.x, src.box.y, src.box.w, src.box.h, 0, 0, cols, rows);
  const d = x.getImageData(0, 0, cols, rows).data;
  inkFn = src.mask === "white" ? inkWhiteBg : inkOf;

  const grid = new Int32Array(cols * rows).fill(-1);
  const out = [];
  for (let gy = 0; gy < rows; gy++) for (let gx = 0; gx < cols; gx++) {
    const i = (gy * cols + gx) * 4;
    const ink = inkFn(d[i], d[i+1], d[i+2]);
    if (ink < 0.35) continue;
    if (state.style === "dither" && ink < 0.5 + BAYER[gy & 3][gx & 3]) continue;
    const rgb = colorFor([d[i], d[i+1], d[i+2]], gx, gy);
    const lum = (0.3 * d[i] + 0.59 * d[i+1] + 0.11 * d[i+2]) / 255;
    grid[gy * cols + gx] = out.length;
    out.push({ gx, gy, tx: ox + gx * cell + cell / 2, ty: oy + gy * cell + cell / 2, rgb, ink, lum, order: 0 });
  }
  bounds = { x0: ox, x1: ox + cols * cell };
  orderReveal(out, grid, cols, rows);
  return out;
}

/** Ordem de entrada. "Pincelada" percorre a mancha por vizinhança (BFS), como um pincel passando. */
function orderReveal(pts, grid, cols, rows) {
  if (!pts.length) return;
  if (state.reveal === "grow") { pts.forEach(p => p.order = 1 - p.gy / rows + Math.random() * 0.08); return normalize(pts); }
  if (state.reveal === "gather") { pts.forEach(p => p.order = Math.random()); return; }
  const dist = new Float32Array(pts.length).fill(-1);
  const byX = pts.map((_, i) => i).sort((a, b) => pts[a].gx - pts[b].gx);
  let base = 0;
  for (const seed of byX) {
    if (dist[seed] >= 0) continue;
    const q = [seed]; dist[seed] = base; let maxD = base;
    for (let h = 0; h < q.length; h++) {
      const p = pts[q[h]];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = p.gx + dx, ny = p.gy + dy;
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        const n = grid[ny * cols + nx];
        if (n >= 0 && dist[n] < 0) { dist[n] = dist[q[h]] + 1; if (dist[n] > maxD) maxD = dist[n]; q.push(n); }
      }
    }
    base = maxD * 0.6; // manchas soltas começam antes da anterior terminar
  }
  pts.forEach((p, i) => p.order = dist[i] + Math.random() * 4);
  normalize(pts);
}
function normalize(pts) {
  let mx = 0; for (const p of pts) mx = Math.max(mx, p.order);
  for (const p of pts) p.order /= mx || 1;
}

function makeParticles(targets, previous) {
  const morph = previous && previous.length && !REDUCED;
  const prev = morph ? previous.slice().sort((a, b) => a.x - b.x) : [];
  const next = morph ? targets.slice().sort((a, b) => a.tx - b.tx) : targets;
  const list = next.map((t, i) => {
    const from = morph ? prev[Math.floor(i * prev.length / next.length)] : null;
    let sx = t.tx, sy = t.ty;
    if (!morph && state.reveal === "gather") { const a = Math.random() * 6.283, r = Math.max(W, H) * (0.6 + Math.random() * 0.5); sx = W / 2 + Math.cos(a) * r; sy = H / 2 + Math.sin(a) * r; }
    if (!morph && state.reveal === "grow") sy = t.ty + cell * 3;
    return {
      ...t, x: from ? from.x : sx, y: from ? from.y : sy, sx: from ? from.x : sx, sy: from ? from.y : sy,
      from: from ? from.rgb : t.rgb, ch: "",
      vx: 0, vy: 0, morph: !!from,
    };
  });
  list.forEach(p => p.ch = pickChar(p));
  return list;
}
function pickChar(p) {
  // mais "denso" onde a cor é mais escura/saturada
  const k = Math.min(CHARS.length - 1, 2 + Math.floor((1 - p.lum) * 5 + p.ink * 3 + Math.random() * 1.5));
  return CHARS[k];
}

// ---------- desenho ----------
const ease = t => t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);
const REVEAL_MS = 2600, EACH_MS = 700;

function frame(now) {
  const t = now - startTime;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const fs = cell * 1.25;
  if (state.style === "chars") { ctx.font = `600 ${fs}px ui-monospace, Menlo, monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; }
  const mr = 70;
  for (const p of particles) {
    const k = REDUCED ? 1 : ease((t - p.order * REVEAL_MS) / EACH_MS);
    if (k <= 0) continue;
    // empurrão do mouse, com mola de volta
    const dx = p.x - mouse.x, dy = p.y - mouse.y, dd = dx * dx + dy * dy;
    if (dd < mr * mr && !REDUCED) { const f = (1 - Math.sqrt(dd) / mr) * 2.2; p.vx += dx / (Math.sqrt(dd) + 1) * f; p.vy += dy / (Math.sqrt(dd) + 1) * f; }
    const bx = p.sx + (p.tx - p.sx) * k, by = p.sy + (p.ty - p.sy) * k;
    p.vx *= 0.86; p.vy *= 0.86;
    p.ox = (p.ox || 0) * 0.9 + p.vx; p.oy = (p.oy || 0) * 0.9 + p.vy;
    let wy = 0;
    if (state.motion === "wave" && !REDUCED) {
      // cabeça (esquerda) quase parada; amplitude cresce até a cauda
      const u = (p.tx - bounds.x0) / (bounds.x1 - bounds.x0 || 1);
      wy = Math.sin(u * 5.5 - now / 420) * cell * 1.6 * Math.pow(u, 1.6);
    }
    p.x = bx + p.ox; p.y = by + p.oy + wy;
    const c = p.morph ? p.from.map((v, i) => Math.round(v + (p.rgb[i] - v) * k)) : p.rgb;
    ctx.globalAlpha = p.morph ? 1 : k;
    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    if (state.style === "chars") {
      if (!REDUCED && Math.random() < 0.004) p.ch = pickChar(p);
      ctx.fillText(p.ch, p.x, p.y);
    } else if (state.style === "dots") {
      const r = cell * 0.5 * (0.45 + 0.55 * p.ink) * (REDUCED ? 1 : 0.92 + 0.08 * Math.sin(now / 400 + p.gx * 0.3 + p.gy * 0.2));
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();
    } else {
      ctx.fillRect(p.x - cell / 2, p.y - cell / 2, cell, cell);
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

// ---------- controle ----------
function resize() {
  const r = canvas.getBoundingClientRect();
  DPR = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
}
function rebuild(morph) {
  const prev = morph ? particles : null;
  particles = makeParticles(buildTargets(sources[state.img]), prev);
  startTime = performance.now();
}
function syncButtons() {
  document.querySelectorAll(".group[data-key]").forEach(g => g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(state[g.dataset.key] === b.dataset.v))));
  document.body.classList.toggle("escuro", state.bg === "noite");
}
document.querySelectorAll(".group[data-key]").forEach(g => g.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state[g.dataset.key] = b.dataset.v; syncButtons(); rebuild(false);
}));
document.getElementById("replay").onclick = () => rebuild(false);
canvas.addEventListener("pointermove", e => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
canvas.addEventListener("pointerleave", () => { mouse.x = mouse.y = -1e4; });
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => { resize(); if (sources.length && W > 10) rebuild(false); }, 150); }).observe(canvas);

(async () => {
  for (const it of IMAGES) sources.push(analyse(await loadImage(it.src), it.mask));
  syncButtons(); resize(); if (W > 10) rebuild(false); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
